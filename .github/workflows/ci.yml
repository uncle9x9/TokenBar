name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (macOS Sequoia)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Run Swift Tests
        run: swift test

      - name: Build Release App
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/package_app.sh

      - name: Verify App Bundle Structure
        run: |
          test -d dist/TokenBar.app
          test -x dist/TokenBar.app/Contents/MacOS/TokenBar
          test -f dist/TokenBar.app/Contents/Info.plist
          echo "App bundle verified successfully."
